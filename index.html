<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介 - テスト太郎</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      padding: 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      background-color: #ff6b35;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 28px;
      color: #333;
      margin: 0 0 8px;
    }
    .label {
      font-size: 13px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 32px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fafafa;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .info-icon {
      font-size: 24px;
    }
    .info-text {
      text-align: left;
    }
    .info-text .key {
      font-size: 12px;
      color: #999;
    }
    .info-text .value {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🍜</div>
    <h1>テスト太郎</h1>
    <p class="label">自己紹介</p>
    <div class="info-item">
      <span class="info-icon">👤</span>
      <div class="info-text">
        <div class="key">名前</div>
        <div class="value">テスト太郎</div>
      </div>
    </div>
    <div class="info-item">
      <span class="info-icon">❤️</span>
      <div class="info-text">
        <div class="key">好きなもの</div>
        <div class="value">ラーメン</div>
      </div>
    </div>
  </div>
</body>
</html>
