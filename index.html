<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語タイピング</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== TITLE BAR ===== */
  #titleBar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 20px;
    font-size: 14px;
    color: #555;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex: 1; }
  .screen.active { display: flex; flex-direction: column; flex: 1; }

  /* ===== TOP SCREEN ===== */
  #topScreen {
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 40px;
  }

  #topScreen h1 {
    font-size: 28px;
    font-weight: 700;
    color: #333;
    letter-spacing: 0.05em;
  }

  #topScreen p {
    font-size: 15px;
    color: #888;
    text-align: center;
  }

  .card-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    max-width: 700px;
  }

  .word-card {
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 16px;
    padding: 28px 36px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-width: 180px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .word-card:hover {
    border-color: #5bc4d4;
    box-shadow: 0 4px 16px rgba(91,196,212,0.2);
    transform: translateY(-2px);
  }

  .word-card .card-icon { font-size: 36px; margin-bottom: 10px; }
  .word-card .card-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 4px; }
  .word-card .card-sub { font-size: 13px; color: #aaa; }

  /* ===== STUDY SCREEN ===== */
  #studyScreen {
    flex-direction: column;
    position: relative;
    min-height: calc(100vh - 45px);
  }

  .study-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 40px;
    gap: 16px;
  }

  .word-display {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  .study-inner {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  /* Speaker button */
  .speaker-btn {
    background: #5bc4d4;
    border: none;
    border-radius: 12px;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .speaker-btn:hover { background: #40b0c2; }
  .speaker-btn svg { width: 36px; height: 36px; fill: #fff; }

  .word-info { display: flex; flex-direction: column; gap: 8px; }

  .japanese-text {
    font-size: 26px;
    color: #333;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .english-hint {
    font-size: 32px;
    font-weight: 700;
    color: #333;
    letter-spacing: 0.08em;
    min-height: 42px;
  }

  .typing-display {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .char-done { color: #333; }
  .char-cursor {
    color: #ccc;
    border-bottom: 3px solid #5bc4d4;
    animation: blink 0.8s infinite;
  }
  .char-cursor-hidden {
    color: transparent;
    border-bottom: 3px solid #5bc4d4;
    animation: blink 0.8s infinite;
  }
  .char-pending { color: #ccc; }

  @keyframes blink {
    0%, 100% { border-color: #5bc4d4; }
    50% { border-color: transparent; }
  }

  .feedback-msg {
    font-size: 18px;
    font-weight: 700;
    min-height: 28px;
    margin-top: 8px;
  }
  .feedback-msg.correct { color: #4caf50; }
  .feedback-msg.incorrect { color: #f44336; }

  /* Progress bar */
  .progress-bar-wrap {
    padding: 0 80px 16px;
  }
  .progress-bar-bg {
    background: #f0f0f0;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: #5bc4d4;
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s;
  }
  .progress-label {
    font-size: 13px;
    color: #aaa;
    margin-top: 6px;
    text-align: right;
  }

  /* Step badge */
  .step-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f5f5f5;
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
    margin-bottom: 20px;
  }
  .step-badge .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #5bc4d4;
  }

  /* Next/Complete buttons */
  .action-btn {
    background: #5bc4d4;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 24px;
    display: none;
  }
  .action-btn:hover { background: #40b0c2; transform: translateY(-1px); }
  .action-btn.visible { display: inline-block; }

  /* ===== RESULT SCREEN ===== */
  #resultScreen {
    align-items: center;
    justify-content: flex-start;
    padding: 40px 60px;
    gap: 24px;
    overflow-y: auto;
  }

  #resultScreen h2 {
    font-size: 26px;
    font-weight: 700;
    color: #333;
  }

  .result-stats {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-box {
    background: #f8f8f8;
    border-radius: 12px;
    padding: 20px 32px;
    text-align: center;
  }
  .stat-box .stat-num { font-size: 40px; font-weight: 700; color: #333; }
  .stat-box .stat-label { font-size: 14px; color: #aaa; margin-top: 4px; }
  .stat-box.correct-stat .stat-num { color: #4caf50; }
  .stat-box.wrong-stat .stat-num { color: #f44336; }

  .review-section { width: 100%; max-width: 600px; }
  .review-section h3 {
    font-size: 18px;
    font-weight: 700;
    color: #f44336;
    margin-bottom: 12px;
  }

  .review-word {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: #fff5f5;
    border: 1px solid #ffcdd2;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 8px;
    font-size: 17px;
  }
  .review-word .rw-jp { color: #888; }
  .review-word .rw-en { font-weight: 700; color: #f44336; }

  .btn-group {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
  }

  .outline-btn {
    background: #fff;
    color: #5bc4d4;
    border: 2px solid #5bc4d4;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .outline-btn:hover { background: #5bc4d4; color: #fff; }

  /* ===== CHARACTERS ===== */
  #characters {
    position: fixed;
    bottom: 0;
    right: 0;
    display: flex;
    align-items: flex-end;
    gap: 0;
    pointer-events: none;
    z-index: 10;
  }

  .char-triangle {
    width: 0; height: 0;
    border-left: 44px solid transparent;
    border-right: 44px solid transparent;
    border-bottom: 76px solid #e8724a;
    position: relative;
    margin-bottom: 8px;
    margin-right: -4px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
  }

  /* Triangle face */
  .char-triangle::before {
    content: '';
    position: absolute;
    bottom: -72px;
    left: -18px;
    width: 36px;
    height: 30px;
    background: #e8724a;
    border-radius: 0 0 10px 10px;
  }

  /* SVG characters using inline elements */
  #charTriangle, #charSquare {
    width: 90px;
    height: 100px;
  }

  /* Flash animation */
  @keyframes flash-green {
    0% { background: #fff; }
    20% { background: #e8f5e9; }
    100% { background: #fff; }
  }
  @keyframes flash-red {
    0% { background: #fff; }
    20% { background: #ffebee; }
    100% { background: #fff; }
  }
  .flash-correct { animation: flash-green 0.4s ease; }
  .flash-red { animation: flash-red 0.3s ease; }

  /* ===== STEP COMPLETE OVERLAY ===== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.92);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 32px; font-weight: 700; color: #333; }
  .overlay p { font-size: 16px; color: #888; }
  .overlay .big-emoji { font-size: 72px; }

  #step1ReviewList {
    max-height: 28vh;
    overflow-y: auto;
    width: 100%;
    max-width: 480px;
  }

  /* Shake animation for wrong */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.3s ease; }

  /* Hint appear */
  .hint-reveal {
    font-size: 16px;
    color: #f44336;
    font-weight: 700;
    margin-top: 4px;
    min-height: 24px;
    letter-spacing: 0.05em;
  }

  /* ===== COUNT SCREEN ===== */
  #countScreen {
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 32px;
  }
  #countScreen h2 {
    font-size: 22px;
    font-weight: 700;
    color: #333;
  }
  #countScreen .set-name {
    font-size: 15px;
    color: #888;
    margin-top: -20px;
  }
  .count-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }
  .count-card {
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 16px;
    padding: 24px 40px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-width: 130px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .count-card:hover {
    border-color: #5bc4d4;
    box-shadow: 0 4px 16px rgba(91,196,212,0.2);
    transform: translateY(-2px);
  }
  .count-card .count-num { font-size: 32px; font-weight: 700; color: #333; }
  .count-card .count-label { font-size: 13px; color: #aaa; margin-top: 4px; }
  .back-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 14px;
    cursor: pointer;
    padding: 8px 16px;
    text-decoration: underline;
  }
  .back-btn:hover { color: #555; }

  /* ===== SPEAK BUTTON (small, reusable) ===== */
  .speak-sm-btn {
    background: #5bc4d4;
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .speak-sm-btn:hover { background: #40b0c2; }
  .speak-sm-btn svg { width: 16px; height: 16px; fill: #fff; }

  /* ===== WORD LIST SCREEN ===== */
  #wordListScreen {
    align-items: center;
    padding: 28px 20px 40px;
    gap: 18px;
    overflow-y: auto;
  }
  #wordListScreen h2 {
    font-size: 22px;
    font-weight: 700;
    color: #333;
  }
  .word-list-table {
    width: 100%;
    max-width: 600px;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    overflow: hidden;
  }
  .word-list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 16px;
  }
  .word-list-row:last-child { border-bottom: none; }
  .word-list-row .wl-jp { flex: 1; color: #555; }
  .word-list-row .wl-en { flex: 1; font-weight: 700; color: #333; }
  .wl-del-btn {
    background: none;
    border: 1px solid #ffcdd2;
    border-radius: 8px;
    color: #f44336;
    font-size: 13px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .wl-del-btn:hover { background: #fff5f5; }
  .word-add-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 600px;
  }
  .word-add-form input {
    flex: 1;
    min-width: 120px;
    padding: 10px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    font-family: inherit;
  }
  .word-add-form input:focus { border-color: #5bc4d4; }
  .word-add-form button {
    background: #5bc4d4;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .word-add-form button:hover { background: #40b0c2; }

  /* ===== CREATE SET SCREEN ===== */
  #createSetScreen {
    align-items: center;
    padding: 28px 20px 60px;
    gap: 20px;
    overflow-y: auto;
  }
  #createSetScreen h2 {
    font-size: 22px;
    font-weight: 700;
    color: #333;
  }
  .create-set-form {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 13px; font-weight: 700; color: #666; letter-spacing: 0.04em; }
  .form-input {
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 18px;
    outline: none;
    font-family: inherit;
    width: 100%;
  }
  .form-input:focus { border-color: #5bc4d4; }
  .emoji-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .emoji-btn {
    font-size: 22px;
    background: #f5f5f5;
    border: 2px solid transparent;
    border-radius: 10px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .emoji-btn:hover { background: #e0f7fa; }
  .emoji-btn.selected { border-color: #5bc4d4; background: #e0f7fa; }
  .new-word-table {
    width: 100%;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    overflow: hidden;
    min-height: 56px;
  }
  .save-set-btn {
    background: #5bc4d4;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
  }
  .save-set-btn:hover { background: #40b0c2; }
  .add-set-btn {
    background: #fff;
    border: 2px dashed #5bc4d4;
    border-radius: 16px;
    padding: 22px 32px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-width: 180px;
    color: #5bc4d4;
    font-size: 16px;
    font-weight: 700;
  }
  .add-set-btn:hover { background: #e0f7fa; }

  @media (max-width: 600px) {
    .study-content { padding: 30px 16px; }
    .progress-bar-wrap { padding: 0 24px 16px; }
    .english-hint { font-size: 24px; }
    .typing-display { font-size: 30px; }
    #resultScreen { padding: 24px 16px; }
  }
</style>
</head>
<body>

<!-- Title Bar -->
<div id="titleBar">英単語タイピング</div>

<!-- ===== TOP SCREEN ===== -->
<div id="topScreen" class="screen active">
  <h1>英単語タイピング</h1>
  <p>単語集を選んでスタートしましょう！</p>
  <div class="card-grid" id="cardGrid"></div>
  <button class="add-set-btn" onclick="openCreateSet()">＋ 単語集を追加</button>
</div>

<!-- ===== CREATE SET SCREEN ===== -->
<div id="createSetScreen" class="screen">
  <h2>単語集を作成</h2>
  <div class="create-set-form">
    <div class="form-group">
      <div class="form-label">タイトル</div>
      <input class="form-input" type="text" id="newSetTitle" placeholder="例：英検4級" />
    </div>
    <div class="form-group">
      <div class="form-label">アイコン</div>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>
    <div class="form-group">
      <div class="form-label">単語を追加</div>
      <div class="word-add-form">
        <input type="text" id="newJpInput" placeholder="日本語（例：犬）" onkeydown="if(event.key==='Enter')document.getElementById('newEnInput').focus()" />
        <input type="text" id="newEnInput" placeholder="英語（例：dog）" onkeydown="if(event.key==='Enter')addNewWord()" />
        <button onclick="addNewWord()">追加</button>
      </div>
    </div>
    <div class="new-word-table" id="newWordTable"></div>
    <button class="save-set-btn" onclick="saveNewSet()">保存する</button>
  </div>
  <button class="back-btn" onclick="cancelCreateSet()">← キャンセル</button>
</div>

<!-- ===== COUNT SCREEN ===== -->
<div id="countScreen" class="screen">
  <h2>問題数を選んでください</h2>
  <div class="set-name" id="countSetName"></div>
  <div class="count-grid" id="countGrid"></div>
  <button class="outline-btn" onclick="openWordList()" style="font-size:14px;padding:10px 24px">出題単語一覧</button>
  <button class="back-btn" onclick="goTop()">← 単語集を選び直す</button>
</div>

<!-- ===== WORD LIST SCREEN ===== -->
<div id="wordListScreen" class="screen">
  <h2 id="wordListTitle">単語一覧</h2>
  <div class="word-list-table" id="wordListTable"></div>
  <div class="word-add-form">
    <input type="text" id="addJpInput" placeholder="日本語（例：犬）" />
    <input type="text" id="addEnInput" placeholder="英語（例：dog）" />
    <button onclick="addWord()">追加</button>
  </div>
  <button class="back-btn" onclick="closeWordList()">← 問題数選択に戻る</button>
</div>

<!-- ===== STUDY SCREEN ===== -->
<div id="studyScreen" class="screen">
  <div class="study-content" id="studyContent">
    <div class="study-inner">
      <div class="step-badge">
        <div class="dot"></div>
        <span id="stepLabel">Step 1：練習モード</span>
      </div>

      <div class="word-display">
        <button class="speaker-btn" id="speakerBtn" onclick="speakWord()" title="もう一度聴く">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <div class="word-info">
          <div class="japanese-text" id="japaneseText"></div>
          <div class="english-hint" id="englishHint"></div>
          <div class="hint-reveal" id="hintReveal"></div>
        </div>
      </div>

      <div class="typing-display" id="typingDisplay"></div>
      <div class="feedback-msg" id="feedbackMsg"></div>
      <button class="action-btn" id="actionBtn" onclick="handleAction()"></button>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="resultScreen" class="screen">
  <h2 id="resultTitle"></h2>
  <div class="result-stats" id="resultStats"></div>
  <div class="review-section" id="reviewSection"></div>
  <div class="btn-group" id="resultBtns"></div>
</div>

<!-- ===== STEP COMPLETE OVERLAY ===== -->
<div class="overlay" id="step1CompleteOverlay">
  <div class="big-emoji">🎉</div>
  <h2>Step 1 完了！</h2>
  <div id="step1ReviewList"></div>
  <button class="action-btn visible" style="margin-top:0" onclick="startStep2()">Step 2 へ進む →</button>
  <button class="outline-btn" onclick="closeOverlay()">もう一度 Step 1 を練習する</button>
  <button class="outline-btn" id="step1ReviewBtn" onclick="reviewWrongFromStep1()" style="display:none">間違えた単語を復習する</button>
  <button class="outline-btn" onclick="goTop()">単語集を選ぶ</button>
</div>

<!-- ===== CHARACTERS (always visible) ===== -->
<div id="characters">
  <!-- Triangle character -->
  <svg id="charTriangle" viewBox="0 0 90 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Flag arm -->
    <line x1="72" y1="28" x2="72" y2="12" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ===== BUZZ SOUND =====
function playBuzz() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

// ===== SUCCESS SOUND =====
function playSuccess() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  } catch(e) {}
}

function speakWordText(text) {

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

// ===== KEY CLICK SOUND (mechanical) =====
function playKeyClick() {
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;

    // ① ノイズバースト（打鍵の瞬間的な衝撃音）
    const noiseLen = Math.floor(ctx.sampleRate * 0.012);
    const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseLen; i++) {
      nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / noiseLen, 3);
    }
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.35, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.012);
    noiseSrc.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noiseSrc.start(t);

    // ② 高周波オシレーター（「カチッ」のトーン成分）
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1800, t);
    osc.frequency.exponentialRampToValueAtTime(600, t + 0.018);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.07, t);
    oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.022);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.025);
  } catch(e) {}
}

    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startStudy() {
  showScreen('studyScreen');

  typedChars = 0;

function loadWord() {
  if (currentIndex >= currentWords.length) {
    stepComplete();
    return;
  }
  const wordObj = currentWords[currentIndex];
  currentWord = wordObj.english.toLowerCase();
  typedChars = 0;
  wrongInThisWord = false;

  updateTitleBar();
  updateProgress();
  updateStepLabel();

  document.getElementById('japaneseText').textContent = wordObj.japanese;
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('hintReveal').textContent = '';

  // Step 1: show English, Step 2: hide English
  if (currentStep === 1) {
    document.getElementById('englishHint').textContent = currentWord;
  } else {
    document.getElementById('englishHint').textContent = '';
  }

  renderTypingDisplay();

  const btn = document.getElementById('actionBtn');
  btn.classList.remove('visible');

  // Auto speak
  setTimeout(speakWord, 200);
}

function renderTypingDisplay() {
  const display = document.getElementById('typingDisplay');
  display.innerHTML = '';
  const hintRevealed = currentStep !== 2 || wrongInThisWord;
  for (let i = 0; i < currentWord.length; i++) {
    const ch = currentWord[i] === ' ' ? '\u00a0' : currentWord[i];
    const span = document.createElement('span');
    if (i < typedChars) {
      span.textContent = ch;
      span.className = 'char-done';
    } else if (i === typedChars) {
      span.textContent = ch;
      span.className = hintRevealed ? 'char-cursor' : 'char-cursor-hidden';
    } else {
      if (!hintRevealed) continue; // Step2 before first mistake: hide future chars
      span.textContent = ch;
      span.className = 'char-pending';
    }
    display.appendChild(span);
  }
}

function updateTitleBar() {
  const set = wordSets.find(s => s.id === currentSetId);
  const stepName = currentStep === 1 ? 'Step 1' : 'Step 2';
  document.getElementById('titleBar').textContent =

function updateProgress() {
  const pct = currentWords.length ? (currentIndex / currentWords.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${currentIndex} / ${currentWords.length}`;
}

function handleKey(e) {
  // Only active in study screen
  if (!document.getElementById('studyScreen').classList.contains('active')) return;
  if (document.getElementById('step1CompleteOverlay').classList.contains('active')) return;

  const btn = document.getElementById('actionBtn');
  if (btn.classList.contains('visible')) {
    if (e.key === 'Enter') handleAction();
    return;
  }

  if (typedChars >= currentWord.length) return;

  const key = e.key.toLowerCase();
  if (key.length !== 1) return;

  const expected = currentWord[typedChars];

  if (key === expected) {
    // Correct!
    playKeyClick();
    typedChars++;
    document.getElementById('feedbackMsg').textContent = '';
    document.getElementById('feedbackMsg').className = 'feedback-msg';
    renderTypingDisplay();

    if (typedChars === currentWord.length) {
      // Word complete
      wordComplete();
    }
  } else {
    // Wrong
    playBuzz();
    shakeDisplay();
    document.getElementById('feedbackMsg').textContent = '× もう一度！';
    document.getElementById('feedbackMsg').className = 'feedback-msg incorrect';

    // Step 2: reveal grey chars on first mistake
    if (currentStep === 2 && !wrongInThisWord) {
      wrongInThisWord = true;
      renderTypingDisplay();
    } else {
      wrongInThisWord = true;
    }
  }
}

function wordComplete() {
  playSuccess();
  document.getElementById('feedbackMsg').textContent = '○ 正解！';
  document.getElementById('feedbackMsg').className = 'feedback-msg correct';

  // ステップ別にミス単語を記録
  if (wrongInThisWord) {
    const w = currentWords[currentIndex];
    const target = currentStep === 1 ? step1WrongWords : step2WrongWords;
    if (!target.find(x => x.english === w.english)) {
      target.push(w);
    }
  }

  // Flash screen green
  flashScreen('correct');

  setTimeout(() => {
    currentIndex++;
    if (currentIndex >= currentWords.length) {
      stepComplete();
    } else {
      loadWord();
    }
  }, 600);
}

function flashScreen(type) {
  const content = document.getElementById('studyContent');
  content.classList.remove('flash-correct', 'flash-red');
  void content.offsetWidth;
  content.classList.add(type === 'correct' ? 'flash-correct' : 'flash-red');
}

function shakeDisplay() {
  const display = document.getElementById('typingDisplay');
  display.classList.remove('shake');
  void display.offsetWidth;
  display.classList.add('shake');
  flashScreen('wrong');
}

// ===== STEP COMPLETE =====
function stepComplete() {
  if (currentStep === 1) {
    document.getElementById('step1ReviewBtn').style.display = step1WrongWords.length > 0 ? '' : 'none';
    const list = document.getElementById('step1ReviewList');
    if (step1WrongWords.length > 0) {
      const spkSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
      list.innerHTML = '<div style="width:100%;max-width:480px;text-align:left">' +
        '<p style="font-size:14px;color:#f44336;font-weight:700;margin-bottom:8px">間違えた単語（' + step1WrongWords.length + '語）</p>' +
        step1WrongWords.map(w =>
          '<div style="display:flex;align-items:center;gap:10px;background:#fff5f5;border:1px solid #ffcdd2;border-radius:10px;padding:10px 16px;margin-bottom:6px;font-size:15px">' +
          '<span style="flex:1;color:#888">' + w.japanese + '</span>' +
          '<span style="flex:1;font-weight:700;color:#f44336">' + w.english + '</span>' +
          '<button class="speak-sm-btn" onclick="speakWordText(\'' + w.english + '\')" title="発音">' + spkSvg + '</button>' +
          '</div>'
        ).join('') + '</div>';
    } else {
      list.innerHTML = '<p style="color:#4caf50;font-size:16px;font-weight:700">🎉 全問ノーミス！</p>';
    }
    document.getElementById('step1CompleteOverlay').classList.add('active');
  } else {
    showResult();
  }
}

function closeOverlay() {
  document.getElementById('step1CompleteOverlay').classList.remove('active');
  currentWords = shuffle([...step1Words]);
  currentIndex = 0;
  step1WrongWords = [];
  loadWord();
}

function reviewWrongFromStep1() {
  if (!step1WrongWords.length) return;
  document.getElementById('step1CompleteOverlay').classList.remove('active');
  currentWords = shuffle([...step1WrongWords]);
  currentStep = 1;
  currentIndex = 0;
  step1WrongWords = [];
  showScreen('studyScreen');
  loadWord();
}

function startStep2() {
  document.getElementById('step1CompleteOverlay').classList.remove('active');
  currentWords = shuffle([...step1Words]);
  currentStep = 2;
  currentIndex = 0;
  step2WrongWords = [];
  loadWord();
}

function handleAction() {
  // placeholder for future action button usage
}

// ===== RESULT SCREEN =====
function showResult() {
  showScreen('resultScreen');
  document.getElementById('titleBar').textContent = '英単語タイピング・結果';

  const set = wordSets.find(s => s.id === currentSetId);
  document.getElementById('resultTitle').textContent = `${set.title} チャレンジ完了！`;

  const total = step1Words.length;
  const wrong = step2WrongWords.length;
  const correct = total - wrong;

  document.getElementById('resultStats').innerHTML = `
    <div class="stat-box">
      <div class="stat-num">${total}</div>
      <div class="stat-label">合計問題数</div>
    </div>
    <div class="stat-box correct-stat">
      <div class="stat-num">${correct}</div>
      <div class="stat-label">正解</div>
    </div>
    <div class="stat-box wrong-stat">
      <div class="stat-num">${wrong}</div>
      <div class="stat-label">ミスあり</div>
    </div>
  `;

  const reviewEl = document.getElementById('reviewSection');
  if (step2WrongWords.length > 0) {
    reviewEl.innerHTML = `<h3>復習しよう！ (${step2WrongWords.length}語)</h3>` +
      step2WrongWords.map(w => `
        <div class="review-word">
          <span class="rw-jp">${w.japanese}</span>
          <span class="rw-en">${w.english}</span>
          <button class="speak-sm-btn" onclick="speakWordText('${w.english}')" title="発音">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </button>
        </div>
      `).join('');
  } else {
    reviewEl.innerHTML = `<p style="color:#4caf50;font-size:18px;font-weight:700;text-align:center">🎉 全問ノーミス！素晴らしい！</p>`;
  }

  document.getElementById('resultBtns').innerHTML = `
    <button class="action-btn visible" style="margin-top:0" onclick="retryStep2()">もう一度チャレンジ</button>
    ${step2WrongWords.length > 0 ? `<button class="outline-btn" onclick="retryWrongOnly()">間違えた単語を復習する</button>` : ''}
    <button class="outline-btn" onclick="goTop()">単語集を選ぶ</button>
  `;
}

function retryStep2() {
  currentWords = shuffle([...step1Words]);
  currentStep = 2;
  currentIndex = 0;
  step2WrongWords = [];
  showScreen('studyScreen');
  loadWord();
}

function retryWrongOnly() {
  if (!step2WrongWords.length) return;
  currentWords = shuffle([...step2WrongWords]);
  currentStep = 1;
  currentIndex = 0;
  step2WrongWords = [];
  showScreen('studyScreen');
  loadWord();
}

function goTop() {
  document.getElementById('step1CompleteOverlay').classList.remove('active');
  document.getElementById('titleBar').textContent = '英単語タイピング';
  showScreen('topScreen');
}

// ===== UTILITY =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== INIT =====
buildTopScreen();
</script>
</body>
</html>
