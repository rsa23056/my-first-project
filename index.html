<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語タイピング</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== TITLE BAR ===== */
  #titleBar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 20px;
    font-size: 14px;
    color: #555;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex: 1; }
  .screen.active { display: flex; flex-direction: column; flex: 1; }

  /* ===== TOP SCREEN ===== */
  #topScreen {
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 40px;
  }

  #topScreen h1 {
    font-size: 28px;
    font-weight: 700;
    color: #333;
    letter-spacing: 0.05em;
  }

  #topScreen p {
    font-size: 15px;
    color: #888;
    text-align: center;
  }

  .card-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    max-width: 700px;
  }

  .word-card {
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 16px;
    padding: 28px 36px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-width: 180px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .word-card:hover {
    border-color: #5bc4d4;
    box-shadow: 0 4px 16px rgba(91,196,212,0.2);
    transform: translateY(-2px);
  }

  .word-card .card-icon { font-size: 36px; margin-bottom: 10px; }
  .word-card .card-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 4px; }
  .word-card .card-sub { font-size: 13px; color: #aaa; }

  /* ===== STUDY SCREEN ===== */
  #studyScreen {
    flex-direction: column;
    position: relative;
    min-height: calc(100vh - 45px);
  }

  .study-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 80px;
    gap: 16px;
  }

  .word-display {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Speaker button */
  .speaker-btn {
    background: #5bc4d4;
    border: none;
    border-radius: 12px;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .speaker-btn:hover { background: #40b0c2; }
  .speaker-btn svg { width: 36px; height: 36px; fill: #fff; }

  .word-info { display: flex; flex-direction: column; gap: 8px; }

  .japanese-text {
    font-size: 22px;
    color: #888;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .english-hint {
    font-size: 32px;
    font-weight: 700;
    color: #333;
    letter-spacing: 0.08em;
    min-height: 42px;
  }

  .typing-display {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .char-done { color: #333; }
  .char-cursor {
    color: #ccc;
    border-bottom: 3px solid #5bc4d4;
    animation: blink 0.8s infinite;
  }
  .char-pending { color: #ccc; }

  @keyframes blink {
    0%, 100% { border-color: #5bc4d4; }
    50% { border-color: transparent; }
  }

  .feedback-msg {
    font-size: 18px;
    font-weight: 700;
    min-height: 28px;
    margin-top: 8px;
  }
  .feedback-msg.correct { color: #4caf50; }
  .feedback-msg.incorrect { color: #f44336; }

  /* Progress bar */
  .progress-bar-wrap {
    padding: 0 80px 16px;
  }
  .progress-bar-bg {
    background: #f0f0f0;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: #5bc4d4;
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s;
  }
  .progress-label {
    font-size: 13px;
    color: #aaa;
    margin-top: 6px;
    text-align: right;
  }

  /* Step badge */
  .step-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f5f5f5;
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
    margin-bottom: 20px;
  }
  .step-badge .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #5bc4d4;
  }

  /* Next/Complete buttons */
  .action-btn {
    background: #5bc4d4;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 24px;
    display: none;
  }
  .action-btn:hover { background: #40b0c2; transform: translateY(-1px); }
  .action-btn.visible { display: inline-block; }

  /* ===== RESULT SCREEN ===== */
  #resultScreen {
    align-items: center;
    justify-content: flex-start;
    padding: 40px 60px;
    gap: 24px;
    overflow-y: auto;
  }

  #resultScreen h2 {
    font-size: 26px;
    font-weight: 700;
    color: #333;
  }

  .result-stats {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-box {
    background: #f8f8f8;
    border-radius: 12px;
    padding: 20px 32px;
    text-align: center;
  }
  .stat-box .stat-num { font-size: 40px; font-weight: 700; color: #333; }
  .stat-box .stat-label { font-size: 14px; color: #aaa; margin-top: 4px; }
  .stat-box.correct-stat .stat-num { color: #4caf50; }
  .stat-box.wrong-stat .stat-num { color: #f44336; }

  .review-section { width: 100%; max-width: 600px; }
  .review-section h3 {
    font-size: 18px;
    font-weight: 700;
    color: #f44336;
    margin-bottom: 12px;
  }

  .review-word {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff5f5;
    border: 1px solid #ffcdd2;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 8px;
    font-size: 17px;
  }
  .review-word .rw-jp { color: #888; }
  .review-word .rw-en { font-weight: 700; color: #f44336; }

  .btn-group {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
  }

  .outline-btn {
    background: #fff;
    color: #5bc4d4;
    border: 2px solid #5bc4d4;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .outline-btn:hover { background: #5bc4d4; color: #fff; }

  /* ===== CHARACTERS ===== */
  #characters {
    position: fixed;
    bottom: 0;
    right: 0;
    display: flex;
    align-items: flex-end;
    gap: 0;
    pointer-events: none;
    z-index: 10;
  }

  .char-triangle {
    width: 0; height: 0;
    border-left: 44px solid transparent;
    border-right: 44px solid transparent;
    border-bottom: 76px solid #e8724a;
    position: relative;
    margin-bottom: 8px;
    margin-right: -4px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
  }

  /* Triangle face */
  .char-triangle::before {
    content: '';
    position: absolute;
    bottom: -72px;
    left: -18px;
    width: 36px;
    height: 30px;
    background: #e8724a;
    border-radius: 0 0 10px 10px;
  }

  /* SVG characters using inline elements */
  #charTriangle, #charSquare {
    width: 90px;
    height: 100px;
  }

  /* Flash animation */
  @keyframes flash-green {
    0% { background: #fff; }
    20% { background: #e8f5e9; }
    100% { background: #fff; }
  }
  @keyframes flash-red {
    0% { background: #fff; }
    20% { background: #ffebee; }
    100% { background: #fff; }
  }
  .flash-correct { animation: flash-green 0.4s ease; }
  .flash-red { animation: flash-red 0.3s ease; }

  /* ===== STEP COMPLETE OVERLAY ===== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.92);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 32px; font-weight: 700; color: #333; }
  .overlay p { font-size: 16px; color: #888; }
  .overlay .big-emoji { font-size: 72px; }

  /* Shake animation for wrong */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.3s ease; }

  /* Hint appear */
  .hint-reveal {
    font-size: 16px;
    color: #f44336;
    font-weight: 700;
    margin-top: 4px;
    min-height: 24px;
    letter-spacing: 0.05em;
  }

  @media (max-width: 600px) {
    .study-content { padding: 30px 24px; }
    .progress-bar-wrap { padding: 0 24px 16px; }
    .english-hint { font-size: 24px; }
    .typing-display { font-size: 30px; }
    #resultScreen { padding: 24px 16px; }
  }
</style>
</head>

    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

// ===== SUCCESS SOUND =====
function playSuccess() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  } catch(e) {}
}

// ===== SPEECH =====
function speakWord() {
  if (!currentWords.length) return;
  const word = currentWords[currentIndex].english;
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

// ===== TOP SCREEN =====
function buildTopScreen() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  wordSets.forEach(set => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = `
      <div class="card-icon">${set.icon}</div>
      <div class="card-title">${set.title}</div>
      <div class="card-sub">${set.sub}</div>
    `;
    card.onclick = () => selectWordSet(set.id);
    grid.appendChild(card);
  });
}

function selectWordSet(id) {
  currentSetId = id;
  const set = wordSets.find(s => s.id === id);
  currentWords = [...set.words];
  currentIndex = 0;
  currentStep = 1;
  wrongWords = [];
  startStudy();
}

// ===== STUDY SCREEN =====
let currentWord = '';
let typedChars = 0;

function startStudy() {
  showScreen('studyScreen');
  currentIndex = 0;
  typedChars = 0;
  loadWord();
}

function loadWord() {
  if (currentIndex >= currentWords.length) {
    stepComplete();
    return;
  }
  const wordObj = currentWords[currentIndex];
  currentWord = wordObj.english.toLowerCase();
  typedChars = 0;
  wrongInThisWord = false;

  updateTitleBar();
  updateProgress();
  updateStepLabel();

  document.getElementById('japaneseText').textContent = wordObj.japanese;
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('hintReveal').textContent = '';

  // Step 1: show English, Step 2: hide English
  if (currentStep === 1) {
    document.getElementById('englishHint').textContent = currentWord;
  } else {
    document.getElementById('englishHint').textContent = '';
  }

  renderTypingDisplay();

  const btn = document.getElementById('actionBtn');
  btn.classList.remove('visible');

  // Auto speak
  setTimeout(speakWord, 200);
}

function renderTypingDisplay() {
  const display = document.getElementById('typingDisplay');
  display.innerHTML = '';
  for (let i = 0; i < currentWord.length; i++) {
    const span = document.createElement('span');
    span.textContent = currentWord[i] === ' ' ? '\u00a0' : currentWord[i];
    if (i < typedChars) {
      span.className = 'char-done';
    } else if (i === typedChars) {
      span.className = 'char-cursor';
    } else {
      span.className = 'char-pending';
    }
    display.appendChild(span);
  }
}

function updateTitleBar() {
  const set = wordSets.find(s => s.id === currentSetId);
  const stepName = currentStep === 1 ? 'Step 1' : 'Step 2';
  document.getElementById('titleBar').textContent =
    `英単語タイピング・${set.title}・${stepName}・No.${currentIndex + 1}`;
}

function updateProgress() {
  const pct = currentWords.length ? (currentIndex / currentWords.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${currentIndex} / ${currentWords.length}`;
}

function updateStepLabel() {
  document.getElementById('stepLabel').textContent =
    currentStep === 1 ? 'Step 1：練習モード' : 'Step 2：チャレンジモード';
}

// ===== KEYBOARD HANDLER =====
document.addEventListener('keydown', handleKey);

function handleKey(e) {
  // Only active in study screen
  if (!document.getElementById('studyScreen').classList.contains('active')) return;
  if (document.getElementById('step1CompleteOverlay').classList.contains('active')) return;

  const btn = document.getElementById('actionBtn');
  if (btn.classList.contains('visible')) {
    if (e.key === 'Enter') handleAction();
    return;
  }

  if (typedChars >= currentWord.length) return;

  const key = e.key.toLowerCase();
  if (key.length !== 1) return;

  const expected = currentWord[typedChars];

  if (key === expected) {
    // Correct!
    typedChars++;
    document.getElementById('feedbackMsg').textContent = '';
    document.getElementById('feedbackMsg').className = 'feedback-msg';
    renderTypingDisplay();

    if (typedChars === currentWord.length) {
      // Word complete
      wordComplete();
    }
  } else {
    // Wrong
    playBuzz();
    shakeDisplay();
    document.getElementById('feedbackMsg').textContent = '× もう一度！';
    document.getElementById('feedbackMsg').className = 'feedback-msg incorrect';

    // Step 2: reveal hint on first mistake
    if (currentStep === 2 && !wrongInThisWord) {
      document.getElementById('hintReveal').textContent = '→ ' + currentWord;
      wrongInThisWord = true;
    }

    if (!wrongInThisWord || currentStep === 1) wrongInThisWord = true;
  }
}

function wordComplete() {
  playSuccess();
  document.getElementById('feedbackMsg').textContent = '○ 正解！';
  document.getElementById('feedbackMsg').className = 'feedback-msg correct';

  // Record wrong words for Step 2
  if (currentStep === 2 && wrongInThisWord) {
    const w = currentWords[currentIndex];
    if (!wrongWords.find(x => x.english === w.english)) {
      wrongWords.push(w);
    }
  }

  // Flash screen green
  flashScreen('correct');

  setTimeout(() => {
    currentIndex++;
    if (currentIndex >= currentWords.length) {
      stepComplete();
    } else {
      loadWord();
    }
  }, 600);
}

function flashScreen(type) {
  const content = document.getElementById('studyContent');
  content.classList.remove('flash-correct', 'flash-red');
  void content.offsetWidth;
  content.classList.add(type === 'correct' ? 'flash-correct' : 'flash-red');
}

function shakeDisplay() {
  const display = document.getElementById('typingDisplay');
  display.classList.remove('shake');
  void display.offsetWidth;
  display.classList.add('shake');
  flashScreen('wrong');
}

// ===== STEP COMPLETE =====
function stepComplete() {
  if (currentStep === 1) {
    document.getElementById('step1CompleteOverlay').classList.add('active');
  } else {
    showResult();
  }
}

function closeOverlay() {
  document.getElementById('step1CompleteOverlay').classList.remove('active');
  currentIndex = 0;
  loadWord();
}

function startStep2() {
  document.getElementById('step1CompleteOverlay').classList.remove('active');
  currentStep = 2;
  currentIndex = 0;
  wrongWords = [];
  loadWord();
}

function handleAction() {
  // placeholder for future action button usage
}

// ===== RESULT SCREEN =====
function showResult() {
  showScreen('resultScreen');
  document.getElementById('titleBar').textContent = '英単語タイピング・結果';

  const set = wordSets.find(s => s.id === currentSetId);
  document.getElementById('resultTitle').textContent = `${set.title} チャレンジ完了！`;

  const total = currentWords.length;
  const wrong = wrongWords.length;
  const correct = total - wrong;

  document.getElementById('resultStats').innerHTML = `
    <div class="stat-box">
      <div class="stat-num">${total}</div>
      <div class="stat-label">合計問題数</div>
    </div>
    <div class="stat-box correct-stat">
      <div class="stat-num">${correct}</div>
      <div class="stat-label">正解</div>
    </div>
    <div class="stat-box wrong-stat">
      <div class="stat-num">${wrong}</div>
      <div class="stat-label">ミスあり</div>
    </div>
  `;

  const reviewEl = document.getElementById('reviewSection');
  if (wrongWords.length > 0) {
    reviewEl.innerHTML = `<h3>復習しよう！ (${wrongWords.length}語)</h3>` +
      wrongWords.map(w => `
        <div class="review-word">
          <span class="rw-jp">${w.japanese}</span>
          <span class="rw-en">${w.english}</span>
        </div>
      `).join('');
  } else {
    reviewEl.innerHTML = `<p style="color:#4caf50;font-size:18px;font-weight:700;text-align:center">🎉 全問ノーミス！素晴らしい！</p>`;
  }

  document.getElementById('resultBtns').innerHTML = `
    <button class="action-btn visible" style="margin-top:0" onclick="retryStep2()">もう一度チャレンジ</button>
    <button class="outline-btn" onclick="goTop()">トップに戻る</button>
  `;
  if (wrongWords.length > 0) {
    document.getElementById('resultBtns').innerHTML += `
      <button class="outline-btn" onclick="retryWrongOnly()">間違えた単語だけ練習</button>
    `;
  }
}

function retryStep2() {
  currentStep = 2;
  currentIndex = 0;
  wrongWords = [];
  showScreen('studyScreen');
  loadWord();
}

function retryWrongOnly() {
  if (!wrongWords.length) return;
  currentWords = [...wrongWords];
  currentStep = 1;
  currentIndex = 0;
  wrongWords = [];
  showScreen('studyScreen');
  loadWord();
}

function goTop() {
  document.getElementById('titleBar').textContent = '英単語タイピング';
  showScreen('topScreen');
}

// ===== UTILITY =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== INIT =====
buildTopScreen();
</script>
</body>
